name: Release

# Push a version tag (e.g. `git tag v1.0.2 && git push origin v1.0.2`) to build the Windows
# installer and publish it as a GitHub release. Run it manually to build without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      # Downloads the pinned OwOCR and speech models (checksum verified), compiles the helpers,
      # type-checks, and builds the NSIS installer into dist/.
      - run: npm run build:win

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*-setup.exe \
            --title "Immersion Tracker ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*-setup.exe
          retention-days: 3
